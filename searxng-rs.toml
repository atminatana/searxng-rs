[general]
instance_name = "SearXNG-rs"
default_lang = "auto"
debug = false

[server]
bind_address = "127.0.0.1"
port = 8888
max_request_timeout = 10.0

[search]
safesearch = 0
default_timeout = 5.0
max_page = 50
autocomplete = false
# Engine suspension after a timeout / network error: min(max, ban), seconds.
ban_time_on_fail = 5
max_ban_time_on_fail = 120
# Cache of engine results: lifetime in seconds (0 = off) and max entries.
cache_ttl = 300.0
cache_max_entries = 1000
# Minimum interval between two requests to the same engine, seconds (0 = off).
engine_min_interval = 1.0

# Engine suspension after typed errors, seconds (0 = off). Defaults = SearXNG.
[search.suspended_times]
access_denied = 180       # "Access denied", HTTP 402/403
captcha = 3600            # CAPTCHA page
too_many_requests = 180   # HTTP 429
cf_captcha = 1296000      # Cloudflare CAPTCHA (15 days)

[outgoing]
# user_agent = "Mozilla/5.0 (X11; Linux x86_64; rv:109.0) Gecko/20100101 Firefox/119.0"
# proxy = "socks5h://127.0.0.1:9050"   # Tor
verify = true
http2 = true
max_connections_per_host = 8

[mcp]
enabled = true

[engines]
# NOTE: this section replaces the built-in engine list entirely: an engine
# missing here is not registered and MCP reports it as "unknown engine".
# NOTE: removed 2026-10-07 as non-working from the current network (live MCP
# check): google, google_news, google_images (HTTP 403), baidu, startpage
# (CAPTCHA), pypi (JavaScript challenge page), brave, yahoo (timeouts). The
# engine code is kept: add a line here to re-enable one.

# general - queried by default when no engines are requested
bing = { enabled = true, weight = 1.0 }
duckduckgo = { enabled = true, weight = 1.0 }
wikipedia = { enabled = true, weight = 1.0 }
yandex = { enabled = true, weight = 1.0 }
naver = { enabled = true, weight = 1.0 }

# it - queried only when requested explicitly (engines="github,crates", ...)
github = { enabled = true, weight = 1.0 }
gitlab = { enabled = true, weight = 1.0 }
npm = { enabled = true, weight = 1.0 }
docker_hub = { enabled = true, weight = 1.0 }
crates = { enabled = true, weight = 1.0 }
hackernews = { enabled = true, weight = 1.0 }

# news / images - queried only when requested explicitly
bing_news = { enabled = true, weight = 1.0 }
bing_images = { enabled = true, weight = 1.0 }

# A custom XPath engine - configured entirely in TOML, no Rust code needed.
# [[engines.custom]]
# name = "hacker_news"
# type = "xpath"
# enabled = true
# search_url = "https://hn.algolia.com/?q={query}"
# results_xpath = "//div[contains(@class,'SearchResult')]"
# url_xpath = ".//a/@href"
# title_xpath = ".//a"
# content_xpath = ".//p"
